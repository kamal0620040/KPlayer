# Project type [web_app, test_runner]
project_type: web_app

# Default profile, Tizen API version
profile: tv-samsung
api_version: "10.0"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output name for application
output_name: tvapp

# Output path for build
output_path: ""

# Enable size optimization of wgt for web workspace
opt: false

# Signing profile to be used for Tizen package signing
# If value is empty: "", active signing profile will be used
# Else If value is ".", default signing profile will be used
signing_profile: ""

# list of certs in web project (.trust-anchor)
trust_anchor: []

# list of files in web project (.html,.css etc) and resources
files:
  - config.xml
  - css/app.css
  - css/tokens.css
  - fonts/GTStandardM-Regular.woff2
  - fonts/GTStandardM-500.woff2
  - fonts/GTStandardM-600.woff2
  - fonts/GTStandardM-Bold.woff2
  - fonts/GTStandardM-800.woff2
  - icon.png
  - images/kplayer.svg
  - images/tizen_32.png
  - index.html
  - js/app.js
  - js/core.js
  - js/epg.js
  - js/net.js
  - js/parsers.js
  - js/player.js
  - js/store.js
  - js/ui-channels.js
  - js/ui-guide.js
  - js/ui-pin.js
  - js/ui-playback.js
  - js/ui-playlists.js
  - js/ui-schedule.js
  - js/ui-search.js
  - js/ui-settings.js
  - js/ui-shell.js
  - js/ui-vod.js
  - js/vendor/qrcode-generator.js
  - js/vod.js

# list of files to exclude based on the matched patterns
excludes:
  - Build/*
  - Debug/*
  - Directory.Build.targets
  - Release/*
  - Test/*
  - \.Build/.*
  - \.buildResult/.*
  - \.csproj
  - \.externalToolBuilders/.*
  - \.gn
  - \.obj/.*
  - \.package/.*
  - \.project
  - \.rds_delta
  - \.sdk_delta.info
  - \.settings/.*
  - \.sign/.*
  - \.tizen-ui-builder-tool.xml
  - \.tizen-rds/.*
  - \.vscode/.*
  - \.tproject
  - \.wgt
  - tizen_web_project.yaml
  - webUnitTest/*
  - qa/*
  - qa/.*

# project dependencies
deps: []

